name: Atualizar base

# Roda todo dia as 15:00 UTC (12h em Brasilia), uma hora depois do dataset
# de origem se atualizar (14h UTC). Tambem da para rodar na mao pela aba
# Actions do repositorio, no botao "Run workflow".
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Montar games.json
        run: python build_data.py

      - name: Comitar se mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json
          if git diff --staged --quiet; then
            echo "Nada mudou."
          else
            git commit -m "base: $(date -u +%Y-%m-%d)"
            git push
          fi
